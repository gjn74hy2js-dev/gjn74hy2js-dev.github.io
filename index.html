<!doctype html>
<!-- 宣告 HTML5 文件類型，讓瀏覽器以標準模式解析頁面。 -->

<html lang="zh-Hant<h2>About</h2>

<p>
黃彥維，新媒體藝術創作者，
關注感知、延遲、記憶與情緒殘留，
透過影像、聲音與互動裝置探索人與感知系統之間的關係。
</p>">
  <!-- head 區：放置頁面設定、標題、字型與樣式連結。 -->
  <head>
    <meta charset="utf-8" />

    <title>創意網頁設計｜新媒體藝術家個人網站範例</title>
    <!--
      引用 css/normalize.css
      作用：先統一不同瀏覽器的預設樣式，例如 body 外距、圖片縮放、連結樣式與盒模型，讓後續版面設計有穩定的起點。
      編寫安排：此檔必須放在 style.css 之前載入；它只處理基礎預設值，不負責藝術家網站的主視覺，避免與後續客製化樣式互相混淆。
    -->
    <link href="css/normalize.css" rel="stylesheet" />
    <!--
      引用 css/style.css
      作用：負責本頁主要視覺設計，包含網站容器、導覽列、頁首、內容欄位、作品卡片、頁尾、響應式寬度與新媒體藝術網站的整體氣質。
      編寫安排：此檔放在 normalize.css 之後載入，並透過 class 選擇器對應 HTML 結構；部分範例會用 @import 拆分 _global、_layout、_nav、_card 等模組，讓學生看懂大型網站如何由模組組裝。
    -->
    <link href="css/style.css" rel="stylesheet" />

<style>
body{

    <meta content="width=device-width, initial-scale=1" name="viewport" />

  <!-- body 區：放置使用者在瀏覽器中看得到的內容。 -->
  <body>
    <!-- header：網站頂部，通常放標誌、主選單與首頁主視覺。 -->
    <header class="site-header">
      <div class="container site-header-inner">
        <div class="site-logo">YAN WEI HUANG</div>
      </div>
    </header>
    <!-- main：頁面的主要內容容器，可放置作品、文字與版面模組。 -->
    <div class="site-main"> 
      <!-- main：頁面的主要內容容器，可放置作品、文字與版面模組。 -->
      <div class="container site-main-inner">
        <div class="content">
          <h2 class="artist-note-title">未來自然標本</h2>
          <p class="artist-note">
            作品以純白色構築出一種安靜卻帶有異樣感的生命形態，如同被重新設計與保存過的未來自然標本。當科技逐漸介入自然，生命是否仍會維持原本的樣貌？又或者，自然早已演化成另一種人工生命。裝置中的脊椎、透明薄片與向上生長的姿態，象徵自然與科技之間持續變異的演化過程。
          </p>
        </div>

        <div class="sidebar">
          <h2 class="artist-note-title">自然與科技的演化</h2>
          <p class="artist-note">
            作品試圖提出一個關於未來的提問：
當自然逐漸被改造、複製與重組後，
人類所理解的「生命」，
是否也正在成為另一種科技產物。
          </p><img src="images/IMG_3711.jpg" width="120%">
        </div>
      </div>
    </div>
    <!-- footer：頁尾區，常放版權、聯絡資訊與社群連結。 -->
    <footer class="site-footer">
      <div class="container site-footer-inner">
        <span class="artist-note">YAN WEI HUANG｜New Media Art Portfolio</span>
      </div>
    </footer>
    <!--
      引用 js/site.js
      作用：負責頁面互動，例如手機選單開合、可及性 aria 狀態更新，以及讓作品卡片或內容區塊在進入畫面時產生淡入動畫。
      編寫安排：此檔放在 body 結尾載入，確保 HTML 元素已經出現在頁面中；JavaScript 會用 querySelector 找到 HTML 的 class，再透過 classList 新增或切換 CSS class，讓互動邏輯與視覺樣式分工合作。
    -->
    <script src="js/site.js"></script>
